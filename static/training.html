<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bone-annotator — Training Monitor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            background: white;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            color: #e67e22;
            font-size: 24px;
        }

        .back-link {
            color: #3498db;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .card {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .card h2 {
            color: #2c3e50;
            font-size: 16px;
            margin-bottom: 15px;
            border-bottom: 2px solid #e67e22;
            padding-bottom: 10px;
        }

        .training-job {
            background: #f8f9fa;
            border-left: 4px solid #e67e22;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 4px;
        }

        .job-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .job-name {
            font-weight: bold;
            color: #2c3e50;
        }

        .job-status {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 12px;
            font-weight: 500;
        }

        .status-running {
            background: #d1ecf1;
            color: #0c5460;
        }

        .status-completed {
            background: #d4edda;
            color: #155724;
        }

        .status-failed {
            background: #f8d7da;
            color: #721c24;
        }

        .progress-bar {
            background: #ecf0f1;
            border-radius: 4px;
            height: 8px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .progress-fill {
            background: linear-gradient(90deg, #3498db, #2980b9);
            height: 100%;
            transition: width 0.3s;
        }

        .job-metrics {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            font-size: 12px;
        }

        .metric {
            text-align: center;
        }

        .metric-value {
            font-weight: bold;
            color: #2c3e50;
            font-size: 16px;
        }

        .metric-label {
            color: #7f8c8d;
            margin-top: 2px;
        }

        .events-log {
            background: #2c3e50;
            color: #ecf0f1;
            border-radius: 4px;
            padding: 12px;
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
        }

        .event {
            padding: 4px 0;
            border-bottom: 1px solid #34495e;
        }

        .event:last-child {
            border-bottom: none;
        }

        .event-time {
            color: #3498db;
        }

        .event-type {
            color: #e67e22;
        }

        .event-message {
            color: #ecf0f1;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #7f8c8d;
        }

        .empty-state svg {
            width: 48px;
            height: 48px;
            margin-bottom: 10px;
            opacity: 0.5;
        }

        .refresh-info {
            text-align: right;
            font-size: 12px;
            color: #7f8c8d;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>🚀 Training Monitor</h1>
            </div>
            <a href="/" class="back-link">← Retour au Dashboard</a>
        </header>

        <div class="card">
            <h2>Tâches de Training</h2>
            <div id="trainingJobs">
                <div class="empty-state">
                    <div>Aucune tâche de training en cours</div>
                    <div style="font-size: 12px; margin-top: 5px;">Les tâches apparaîtront ici lors du lancement du training</div>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>Événements</h2>
            <div id="eventLog" class="events-log">
                <div class="event">
                    <span class="event-time">[--:--:--]</span>
                    <span class="event-type">[INFO]</span>
                    <span class="event-message">En attente des événements...</span>
                </div>
            </div>
            <div class="refresh-info" id="lastUpdate">Chargement...</div>
        </div>
    </div>

    <script>
        let eventBuffer = [];

        async function loadTrainingStatus() {
            try {
                const resp = await fetch('/api/training/status');
                if (resp.ok) {
                    const data = await resp.json();
                    updateTrainingJobs(data.jobs || []);
                }
            } catch (error) {
                console.error('Error loading training status:', error);
            }
            updateLastUpdate();
        }

        function updateTrainingJobs(jobs) {
            const container = document.getElementById('trainingJobs');

            if (jobs.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div>Aucune tâche de training en cours</div>
                        <div style="font-size: 12px; margin-top: 5px;">Les tâches apparaîtront ici lors du lancement du training</div>
                    </div>
                `;
                return;
            }

            let html = '';
            for (const job of jobs) {
                const statusClass = job.status.toLowerCase();
                const progress = job.progress || 0;

                html += `
                    <div class="training-job">
                        <div class="job-header">
                            <div class="job-name">${escapeHtml(job.name || 'Training Job')}</div>
                            <span class="job-status status-${statusClass}">${job.status}</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${progress}%"></div>
                        </div>
                        <div class="job-metrics">
                            <div class="metric">
                                <div class="metric-value">${job.epochs || 0}</div>
                                <div class="metric-label">Epochs</div>
                            </div>
                            <div class="metric">
                                <div class="metric-value">${(job.loss || 0).toFixed(3)}</div>
                                <div class="metric-label">Loss</div>
                            </div>
                            <div class="metric">
                                <div class="metric-value">${(job.accuracy || 0).toFixed(1)}%</div>
                                <div class="metric-label">Accuracy</div>
                            </div>
                        </div>
                    </div>
                `;
            }
            container.innerHTML = html;
        }

        function addEvent(type, message) {
            const now = new Date();
            const time = now.toLocaleTimeString();

            eventBuffer.unshift({
                time,
                type,
                message
            });

            if (eventBuffer.length > 100) {
                eventBuffer.pop();
            }

            updateEventLog();
        }

        function updateEventLog() {
            const log = document.getElementById('eventLog');
            let html = '';

            for (const event of eventBuffer.slice(0, 50)) {
                html += `
                    <div class="event">
                        <span class="event-time">[${event.time}]</span>
                        <span class="event-type">[${event.type}]</span>
                        <span class="event-message">${escapeHtml(event.message)}</span>
                    </div>
                `;
            }

            log.innerHTML = html || '<div class="event"><span class="event-message">En attente des événements...</span></div>';
        }

        function updateLastUpdate() {
            const now = new Date();
            document.getElementById('lastUpdate').textContent = `Dernière mise à jour: ${now.toLocaleTimeString()}`;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Connect to SSE stream (when available)
        function setupSSE() {
            try {
                const eventSource = new EventSource('/api/events');

                eventSource.addEventListener('training_start', (event) => {
                    const data = JSON.parse(event.data);
                    addEvent('TRAINING', `Starting: ${data.job_name}`);
                });

                eventSource.addEventListener('training_progress', (event) => {
                    const data = JSON.parse(event.data);
                    addEvent('PROGRESS', `Epoch ${data.epoch}/${data.total_epochs} - Loss: ${data.loss.toFixed(3)}`);
                });

                eventSource.addEventListener('training_complete', (event) => {
                    const data = JSON.parse(event.data);
                    addEvent('SUCCESS', `Completed: ${data.job_name}`);
                });

                eventSource.addEventListener('error', () => {
                    addEvent('ERROR', 'Connexion SSE perdue');
                    eventSource.close();
                    setTimeout(setupSSE, 5000);
                });
            } catch (error) {
                console.log('SSE not available, using polling');
            }
        }

        // Initial load
        loadTrainingStatus();
        setupSSE();

        // Refresh every 5 seconds
        setInterval(loadTrainingStatus, 5000);
    </script>
</body>
</html>
