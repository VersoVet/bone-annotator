<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bone-annotator — Gestion Annotations</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh; padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        header { background: white; border-radius: 8px; padding: 20px; margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; }
        h1 { font-size: 1.5em; color: #2d3748; }
        .btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.9em;
            font-weight: 500; transition: all 0.2s; }
        .btn-primary { background: #4299e1; color: white; }
        .btn-primary:hover { background: #3182ce; }
        .btn-success { background: #48bb78; color: white; }
        .btn-danger { background: #fc8181; color: white; }
        .btn-sm { padding: 4px 10px; font-size: 0.8em; }
        .btn-outline { background: transparent; border: 1px solid #cbd5e0; color: #4a5568; }

        /* Create form */
        .create-form { background: white; border-radius: 8px; padding: 20px; margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: none; }
        .create-form.show { display: block; }
        .form-row { display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
        .form-group { flex: 1; min-width: 180px; }
        .form-group label { display: block; font-size: 0.8em; color: #718096; margin-bottom: 4px; font-weight: 600; }
        .form-group select, .form-group input {
            width: 100%; padding: 8px 12px; border: 1px solid #e2e8f0; border-radius: 6px; font-size: 0.9em; }
        .checkbox-group { display: flex; align-items: center; gap: 8px; padding-top: 20px; }
        .checkbox-group input[type="checkbox"] { width: 18px; height: 18px; }

        /* Filters */
        .filters { background: white; border-radius: 8px; padding: 15px 20px; margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        .filters select { padding: 6px 10px; border: 1px solid #e2e8f0; border-radius: 6px; font-size: 0.85em; }

        /* Task table */
        .task-table { background: white; border-radius: 8px; overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; }
        th { background: #edf2f7; padding: 12px 16px; text-align: left; font-size: 0.8em;
            color: #4a5568; text-transform: uppercase; letter-spacing: 0.05em; }
        td { padding: 10px 16px; border-top: 1px solid #edf2f7; font-size: 0.9em; color: #2d3748; }
        tr:hover { background: #f7fafc; }

        /* Status badges */
        .badge { padding: 3px 10px; border-radius: 12px; font-size: 0.75em; font-weight: 600; }
        .badge-created { background: #edf2f7; color: #718096; }
        .badge-preparing { background: #fefcbf; color: #975a16; }
        .badge-annotating { background: #bee3f8; color: #2b6cb0; }
        .badge-reviewing { background: #fefcbf; color: #975a16; }
        .badge-validated { background: #c6f6d5; color: #276749; }
        .badge-rejected { background: #fed7d7; color: #9b2c2c; }
        .badge-uploading { background: #bee3f8; color: #2c5282; }
        .badge-failed { background: #fed7d7; color: #c53030; }

        .header-left { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .version-badge { font-size: 0.75em; background: #edf2f7; color: #4a5568; padding: 4px 10px;
            border-radius: 12px; text-decoration: none; font-weight: 600; }
        .version-badge:hover { background: #e2e8f0; }
        .icon-btn { background: transparent; border: 1px solid #cbd5e0; border-radius: 6px;
            width: 36px; height: 36px; cursor: pointer; font-size: 1.1em; display: inline-flex;
            align-items: center; justify-content: center; text-decoration: none; color: #4a5568; }
        .icon-btn:hover { background: #edf2f7; }
        .tracking-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px; margin-bottom: 15px; }
        .track-card { background: white; border-radius: 8px; padding: 12px 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .track-card h4 { font-size: 0.7em; text-transform: uppercase; color: #718096; margin-bottom: 6px; }
        .track-val { font-size: 1.3em; font-weight: 700; color: #2d3748; }
        .track-sub { font-size: 0.75em; color: #a0aec0; margin-top: 4px; }
        .header-actions { display: flex; gap: 8px; align-items: center; }
        .empty-state { text-align: center; padding: 60px 20px; color: #a0aec0; }
        .stats-bar { display: flex; gap: 20px; margin-bottom: 15px; }
        .stat { background: white; border-radius: 8px; padding: 12px 20px; flex: 1;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1); text-align: center; }
        .stat-value { font-size: 1.8em; font-weight: 700; color: #2d3748; }
        .stat-label { font-size: 0.8em; color: #718096; }
    </style>
</head>
<body>
<div class="container">
    <header>
        <div class="header-left">
            <h1 id="pageTitle">Gestion des Annotations</h1>
            <a class="version-badge" id="versionBadge" href="/health" target="_blank" title="Version manifest">v…</a>
        </div>
        <div class="header-actions">
            <a class="icon-btn" href="/annotate/learning" title="Suivi apprentissage BoneSeg">📊</a>
            <a class="icon-btn" href="/annotate/settings" title="Paramètres imaging treatment">⚙</a>
            <button class="btn btn-outline" onclick="loadTasks()">Rafraichir</button>
            <button class="btn btn-primary" onclick="toggleForm()">+ Nouvelle Tache</button>
        </div>
    </header>

    <div class="tracking-bar" id="trackingBar"></div>

    <div class="stats-bar" id="stats"></div>

    <div class="create-form" id="createForm">
        <h3 style="margin-bottom:12px; color:#2d3748;">Nouvelle tache d'annotation</h3>
        <div class="form-row">
            <div class="form-group">
                <label>Source</label>
                <select id="sourceSelect" onchange="loadAcquisitions()">
                    <option value="bonestore">BoneStore NFS</option>
                </select>
            </div>
            <div class="form-group">
                <label>Type d'os</label>
                <select id="boneTypeSelect" onchange="filterAcquisitions()">
                    <option value="">Tous</option>
                    <option value="humerus">Humerus</option>
                    <option value="radius">Radius</option>
                    <option value="ulna">Ulna</option>
                    <option value="femur">Femur</option>
                    <option value="tibia">Tibia</option>
                    <option value="scapula">Scapula</option>
                </select>
            </div>
            <div class="form-group">
                <label>Acquisition</label>
                <select id="acqSelect"><option value="">Charger les acquisitions...</option></select>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Imaging treatment</label>
                <select id="presetSelect">
                    <option value="">Chargement...</option>
                </select>
            </div>
            <div class="form-group">
                <label>Assignee CVAT</label>
                <select id="assigneeSelect">
                    <option value="">Chargement...</option>
                </select>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="preAnnotate">
                <label for="preAnnotate" style="font-size:0.9em;">Pre-annotation ML (bone-ml)</label>
            </div>
        </div>
        <div style="margin-top:12px; display:flex; gap:8px;">
            <button class="btn btn-primary" onclick="createTask()">Creer la tache</button>
            <button class="btn btn-outline" onclick="toggleForm()">Annuler</button>
        </div>
        <div id="createStatus" style="margin-top:8px; font-size:0.85em;"></div>
    </div>

    <div class="filters">
        <label style="font-size:0.85em; font-weight:600; color:#4a5568;">Filtres:</label>
        <select id="filterStatus" onchange="loadTasks()">
            <option value="">Tous les statuts</option>
            <option value="preparing">Preparing</option>
            <option value="uploading">Uploading</option>
            <option value="created">Created</option>
            <option value="annotating">Annotating</option>
            <option value="reviewing">Reviewing</option>
            <option value="validated">Validated</option>
            <option value="rejected">Rejected</option>
            <option value="failed">Failed</option>
        </select>
        <select id="filterBone" onchange="loadTasks()">
            <option value="">Tous les os</option>
            <option value="humerus">Humerus</option>
            <option value="radius">Radius</option>
            <option value="ulna">Ulna</option>
            <option value="femur">Femur</option>
        </select>
    </div>

    <div class="task-table">
        <table>
            <thead><tr>
                <th>ID</th><th>Acquisition</th><th>Os</th><th>Imaging treatment</th>
                <th>Status</th><th>Assignee</th><th>Frames</th><th>Actions</th>
            </tr></thead>
            <tbody id="taskBody">
                <tr><td colspan="8" class="empty-state">Chargement...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
const API = '';
let pipelineLabels = {};
let pollTimer = null;
let pollIntervalMs = 5000;
let defaultTreatment = 'os_nu_medsam_user';

function toggleForm() {
    document.getElementById('createForm').classList.toggle('show');
}

async function loadCvatUsers() {
    const sel = document.getElementById('assigneeSelect');
    try {
        const r = await fetch(`${API}/api/cvat/users`);
        const d = await r.json();
        sel.innerHTML = '<option value="">Non assigne</option>';
        (d.users || []).forEach(u => {
            sel.innerHTML += `<option value="${u.username}">${u.username} (id ${u.id})</option>`;
        });
    } catch(e) {
        sel.innerHTML = '<option value="">Erreur chargement</option>';
        console.error('CVAT users:', e);
    }
}

async function loadSources() {
    try {
        const r = await fetch(`${API}/api/sources`);
        const d = await r.json();
        const sel = document.getElementById('sourceSelect');
        sel.innerHTML = '';
        (d.sources || []).forEach(s => {
            sel.innerHTML += `<option value="${s.name}">${s.name} - ${s.description}</option>`;
        });
    } catch(e) { console.error('Sources:', e); }
}

async function loadAcquisitions() {
    const source = document.getElementById('sourceSelect').value;
    const bone = document.getElementById('boneTypeSelect').value;
    const sel = document.getElementById('acqSelect');
    sel.innerHTML = '<option value="">Chargement...</option>';
    try {
        let url = `${API}/api/sources/${source}/acquisitions?limit=500`;
        if (bone) url += `&bone_type=${bone}`;
        const r = await fetch(url);
        const d = await r.json();
        sel.innerHTML = '<option value="">Selectionnez...</option>';
        (d.acquisitions || []).forEach(a => {
            sel.innerHTML += `<option value="${a.id}" data-bone="${a.bone_type}">${a.id} (${a.bone_type} ${a.side} - ${a.frame_count} frames)</option>`;
        });
    } catch(e) {
        sel.innerHTML = '<option value="">Erreur chargement</option>';
    }
}

function filterAcquisitions() { loadAcquisitions(); }

async function createTask() {
    const acq = document.getElementById('acqSelect');
    const opt = acq.options[acq.selectedIndex];
    if (!acq.value) { alert('Selectionnez une acquisition'); return; }
    const bone = opt.dataset.bone || document.getElementById('boneTypeSelect').value;
    const body = {
        source_name: document.getElementById('sourceSelect').value,
        acquisition_id: acq.value,
        bone_type: bone,
        pipeline_preset: document.getElementById('presetSelect').value,
        assignee: document.getElementById('assigneeSelect').value || null,
        pre_annotate: document.getElementById('preAnnotate').checked,
    };
    const status = document.getElementById('createStatus');
    status.textContent = 'Creation en cours...';
    try {
        const r = await fetch(`${API}/api/annotation/task`, {
            method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body)
        });
        const d = await r.json();
        if (r.ok) {
            status.innerHTML = `<span style="color:green">Tache ${d.task?.id} creee!</span>`;
            toggleForm(); loadTasks();
        } else {
            status.innerHTML = `<span style="color:red">Erreur: ${d.detail || 'Inconnu'}</span>`;
        }
    } catch(e) { status.innerHTML = `<span style="color:red">${e}</span>`; }
}

async function loadTasks() {
    const status = document.getElementById('filterStatus').value;
    const bone = document.getElementById('filterBone').value;
    let url = `${API}/api/annotation/tasks?limit=100`;
    if (status) url += `&status=${status}`;
    if (bone) url += `&bone_type=${bone}`;
    try {
        const r = await fetch(url);
        const d = await r.json();
        renderTasks(d.tasks || []);
        renderStats(d.tasks || [], d.total || 0);
    } catch(e) {
        document.getElementById('taskBody').innerHTML =
            '<tr><td colspan="8" class="empty-state">Erreur de chargement</td></tr>';
    }
}

function renderStats(tasks, total) {
    const counts = { preparing:0, uploading:0, created:0, annotating:0, reviewing:0, validated:0, rejected:0, failed:0 };
    tasks.forEach(t => { if (counts[t.status] !== undefined) counts[t.status]++; });
    const inProgress = counts.preparing + counts.uploading + counts.annotating;
    document.getElementById('stats').innerHTML = `
        <div class="stat"><div class="stat-value">${total}</div><div class="stat-label">Total</div></div>
        <div class="stat"><div class="stat-value">${inProgress}</div><div class="stat-label">En cours</div></div>
        <div class="stat"><div class="stat-value">${counts.reviewing}</div><div class="stat-label">Review</div></div>
        <div class="stat"><div class="stat-value">${counts.validated}</div><div class="stat-label">Validees</div></div>
        <div class="stat"><div class="stat-value">${counts.failed}</div><div class="stat-label">Echecs</div></div>`;
    schedulePoll(tasks);
}

function schedulePoll(tasks) {
    const needsPoll = tasks.some(t => ['preparing','uploading'].includes(t.status));
    if (needsPoll && !pollTimer) {
        pollTimer = setInterval(loadTasks, pollIntervalMs);
    } else if (!needsPoll && pollTimer) {
        clearInterval(pollTimer); pollTimer = null;
    }
}

async function loadTracking() {
    const bar = document.getElementById('trackingBar');
    try {
        const r = await fetch(`${API}/api/admin/tracking`);
        const d = await r.json();
        const local = d.local || {};
        const cat = d.catalog || {};
        const byStatus = local.tasks_by_status || {};
        const byTier = local.annotations_by_tier || {};
        const catStatus = cat.by_status || {};
        bar.innerHTML = `
            <div class="track-card"><h4>Catalogue BoneStore</h4>
                <div class="track-val">${cat.total ?? local.catalog_total ?? 0}</div>
                <div class="track-sub">${Object.entries(catStatus).map(([k,v])=>k+': '+v).join(' · ') || 'bone-ml sync pending'}</div></div>
            <div class="track-card"><h4>Quality tiers</h4>
                <div class="track-val">${Object.values(byTier).reduce((a,b)=>a+b,0)}</div>
                <div class="track-sub">gold ${byTier.gold||0} · silver ${byTier.silver||0} · pseudo ${byTier.pseudo||0}</div></div>
            <div class="track-card"><h4>Test set gelé</h4>
                <div class="track-val">${local.test_set_total||0}</div>
                <div class="track-sub">acquisitions</div></div>
            <div class="track-card"><h4>Tâches actives</h4>
                <div class="track-val">${(byStatus.preparing||0)+(byStatus.uploading||0)+(byStatus.annotating||0)}</div>
                <div class="track-sub">preparing ${byStatus.preparing||0} · uploading ${byStatus.uploading||0}</div></div>`;
    } catch(e) { bar.innerHTML = ''; }
}

function treatmentLabel(preset) {
    return pipelineLabels[preset] || preset || '-';
}

function renderTasks(tasks) {
    const body = document.getElementById('taskBody');
    if (!tasks.length) {
        body.innerHTML = '<tr><td colspan="8" class="empty-state">Aucune tache. Cliquez "+ Nouvelle Tache".</td></tr>';
        return;
    }
    body.innerHTML = tasks.map(t => `<tr>
        <td><strong>#${t.id}</strong></td>
        <td>${t.acquisition_id}</td>
        <td>${t.bone_type}${t.region !== 'entire' ? ' ('+t.region+')' : ''}</td>
        <td>${treatmentLabel(t.pipeline_preset)}</td>
        <td><span class="badge badge-${t.status}">${t.status}</span>
            ${t.progress ? `<div style="font-size:0.75em;color:#718096;margin-top:2px">${t.progress.step}: ${t.progress.detail||''}</div>` : ''}
            ${t.has_pre_annotations ? '<span class="badge" style="background:#e9d8fd;color:#6b46c1;margin-left:4px">ML</span>' : ''}</td>
        <td>${t.assignee || '-'}</td>
        <td>${t.annotated_frames || 0}/${t.frame_count || 0}</td>
        <td class="actions">
            ${t.cvat_url ? `<a href="${t.cvat_url}" target="_blank" class="btn btn-sm btn-outline">CVAT</a>` : ''}
            ${['created','annotating'].includes(t.status) ? `<button class="btn btn-sm btn-outline" onclick="syncTask(${t.id})">Sync</button>` : ''}
            ${['created','annotating'].includes(t.status) ? `<button class="btn btn-sm btn-outline" style="background:#7c3aed;color:white;border-color:#7c3aed" onclick="propagateMedSAM2(${t.id})">MedSAM2</button>` : ''}
            ${!t.has_pre_annotations ? `<button class="btn btn-sm btn-outline" onclick="preAnnotate(${t.id})">ML</button>` : ''}
            ${t.status === 'reviewing' ? `<button class="btn btn-sm btn-success" onclick="validateTask(${t.id},'validated')">Valider</button>
                <button class="btn btn-sm btn-danger" onclick="validateTask(${t.id},'rejected')">Rejeter</button>` : ''}
        </td>
    </tr>`).join('');
}

async function syncTask(id) {
    if (!confirm('Synchroniser les annotations depuis CVAT ?')) return;
    try {
        const r = await fetch(`${API}/api/annotation/sync/${id}`, {method:'POST'});
        const d = await r.json();
        alert(`Sync: ${d.synced_frames} frames, ${d.zones_count} zones, ${d.landmarks_count} landmarks (auteur: ${d.author})`);
        loadTasks();
    } catch(e) { alert('Erreur sync: '+e); }
}

async function propagateMedSAM2(id) {
    const seedFrame = prompt('Frame seed (index de la frame annotee, defaut 0):', '0');
    if (seedFrame === null) return;
    const seed = parseInt(seedFrame) || 0;
    if (!confirm(`Propager MedSAM2 depuis la frame ${seed} vers toute la serie ?\\n\\nAssurez-vous d\\'avoir annote au moins une frame dans CVAT avant.`)) return;
    const status = document.getElementById('createStatus');
    status.textContent = 'MedSAM2 propagation en cours... (peut prendre 1-2 min)';
    status.style.color = '#7c3aed';
    try {
        const r = await fetch(`${API}/api/annotation/propagate/${id}?seed_frame=${seed}`, {method:'POST'});
        const d = await r.json();
        if (r.ok) {
            alert(`MedSAM2: ${d.propagated_masks} masques propages sur ${d.sampled_frames} frames (total: ${d.total_frames})`);
        } else {
            alert(`Erreur: ${d.detail || JSON.stringify(d)}`);
        }
        status.textContent = '';
        loadTasks();
    } catch(e) {
        alert('Erreur MedSAM2: '+e);
        status.textContent = '';
    }
}

async function preAnnotate(id) {
    if (!confirm('Demander les pre-annotations ML (bone-ml) ?')) return;
    try {
        const r = await fetch(`${API}/api/annotation/pre-annotate/${id}`, {method:'POST'});
        const d = await r.json();
        alert(`Pre-annotation: ${d.status} (bone-ml: ${d.bone_ml_status})`);
        loadTasks();
    } catch(e) { alert('Erreur: '+e); }
}

async function validateTask(id, decision) {
    const by = prompt('Votre nom (validateur):');
    if (!by) return;
    try {
        const r = await fetch(`${API}/api/annotation/validate/${id}`, {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({validated_by: by, decision: decision})
        });
        const d = await r.json();
        alert(`Tache ${id}: ${d.status}`);
        loadTasks();
    } catch(e) { alert('Erreur: '+e); }
}

async function loadPipelines() {
    const sel = document.getElementById('presetSelect');
    try {
        const [pipeR, cfgR] = await Promise.all([
            fetch(`${API}/api/preparation/pipelines`),
            fetch(`${API}/api/admin/settings`),
        ]);
        const d = await pipeR.json();
        const cfg = await cfgR.json();
        defaultTreatment = cfg.imaging?.default_treatment || defaultTreatment;
        sel.innerHTML = '';
        pipelineLabels = {};
        const groups = { user: [], bundled: [], clinical: [], custom: [] };
        (d.pipelines || []).forEach(p => {
            pipelineLabels[p.name] = p.display_name || p.name;
            const src = p.source || 'custom';
            (groups[src] || groups.custom).push(p);
        });
        const labels = { user: 'Utilisateur [USER]', bundled: 'Bundled (imaging-sdk)', clinical: 'Clinical', custom: 'Autre' };
        for (const [key, items] of Object.entries(groups)) {
            if (!items.length) continue;
            const og = document.createElement('optgroup');
            og.label = labels[key] || key;
            items.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.name;
                opt.textContent = `${p.display_name || p.name} (${p.filters} filtres)`;
                if (p.name === defaultTreatment || p.is_default) opt.selected = true;
                og.appendChild(opt);
            });
            sel.appendChild(og);
        }
    } catch(e) {
        sel.innerHTML = `<option value="${defaultTreatment}">${defaultTreatment} (fallback)</option>`;
        console.error('Pipelines:', e);
    }
}

async function loadPageConfig() {
    try {
        const [healthR, cfgR] = await Promise.all([
            fetch(`${API}/health`), fetch(`${API}/api/admin/settings`)]);
        const health = await healthR.json();
        const cfg = await cfgR.json();
        document.getElementById('versionBadge').textContent = `v${health.version}`;
        document.getElementById('pageTitle').textContent = cfg.dashboard?.title || 'Gestion des Annotations';
        pollIntervalMs = cfg.dashboard?.poll_interval_ms || 5000;
        defaultTreatment = cfg.imaging?.default_treatment || defaultTreatment;
    } catch(e) { console.error('Config:', e); }
}

// Init
loadPageConfig();
loadSources();
loadCvatUsers();
loadPipelines();
loadTracking();
loadTasks();
setInterval(loadTracking, 30000);
</script>
</body>
</html>
