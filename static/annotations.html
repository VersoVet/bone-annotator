<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bone-annotator — Gestion Annotations</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh; padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        header { background: white; border-radius: 8px; padding: 20px; margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; }
        h1 { font-size: 1.5em; color: #2d3748; }
        .btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.9em;
            font-weight: 500; transition: all 0.2s; }
        .btn-primary { background: #4299e1; color: white; }
        .btn-primary:hover { background: #3182ce; }
        .btn-success { background: #48bb78; color: white; }
        .btn-danger { background: #fc8181; color: white; }
        .btn-sm { padding: 4px 10px; font-size: 0.8em; }
        .btn-outline { background: transparent; border: 1px solid #cbd5e0; color: #4a5568; }

        /* Create form */
        .create-form { background: white; border-radius: 8px; padding: 20px; margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: none; }
        .create-form.show { display: block; }
        .form-row { display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
        .form-group { flex: 1; min-width: 180px; }
        .form-group label { display: block; font-size: 0.8em; color: #718096; margin-bottom: 4px; font-weight: 600; }
        .form-group select, .form-group input {
            width: 100%; padding: 8px 12px; border: 1px solid #e2e8f0; border-radius: 6px; font-size: 0.9em; }
        .checkbox-group { display: flex; align-items: center; gap: 8px; padding-top: 20px; }
        .checkbox-group input[type="checkbox"] { width: 18px; height: 18px; }

        /* Filters */
        .filters { background: white; border-radius: 8px; padding: 15px 20px; margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        .filters select { padding: 6px 10px; border: 1px solid #e2e8f0; border-radius: 6px; font-size: 0.85em; }

        /* Task table */
        .task-table { background: white; border-radius: 8px; overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; }
        th { background: #edf2f7; padding: 12px 16px; text-align: left; font-size: 0.8em;
            color: #4a5568; text-transform: uppercase; letter-spacing: 0.05em; }
        td { padding: 10px 16px; border-top: 1px solid #edf2f7; font-size: 0.9em; color: #2d3748; }
        tr:hover { background: #f7fafc; }

        /* Status badges */
        .badge { padding: 3px 10px; border-radius: 12px; font-size: 0.75em; font-weight: 600; }
        .badge-created { background: #edf2f7; color: #718096; }
        .badge-preparing { background: #fefcbf; color: #975a16; }
        .badge-annotating { background: #bee3f8; color: #2b6cb0; }
        .badge-reviewing { background: #fefcbf; color: #975a16; }
        .badge-validated { background: #c6f6d5; color: #276749; }
        .badge-rejected { background: #fed7d7; color: #9b2c2c; }

        .actions { display: flex; gap: 4px; flex-wrap: wrap; }
        .empty-state { text-align: center; padding: 60px 20px; color: #a0aec0; }
        .stats-bar { display: flex; gap: 20px; margin-bottom: 15px; }
        .stat { background: white; border-radius: 8px; padding: 12px 20px; flex: 1;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1); text-align: center; }
        .stat-value { font-size: 1.8em; font-weight: 700; color: #2d3748; }
        .stat-label { font-size: 0.8em; color: #718096; }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>Gestion des Annotations</h1>
        <div>
            <button class="btn btn-outline" onclick="loadTasks()">Rafraichir</button>
            <button class="btn btn-primary" onclick="toggleForm()">+ Nouvelle Tache</button>
        </div>
    </header>

    <div class="stats-bar" id="stats"></div>

    <div class="create-form" id="createForm">
        <h3 style="margin-bottom:12px; color:#2d3748;">Nouvelle tache d'annotation</h3>
        <div class="form-row">
            <div class="form-group">
                <label>Source</label>
                <select id="sourceSelect" onchange="loadAcquisitions()">
                    <option value="bonestore">BoneStore NFS</option>
                </select>
            </div>
            <div class="form-group">
                <label>Type d'os</label>
                <select id="boneTypeSelect" onchange="filterAcquisitions()">
                    <option value="">Tous</option>
                    <option value="humerus">Humerus</option>
                    <option value="radius">Radius</option>
                    <option value="ulna">Ulna</option>
                    <option value="femur">Femur</option>
                    <option value="tibia">Tibia</option>
                    <option value="scapula">Scapula</option>
                </select>
            </div>
            <div class="form-group">
                <label>Acquisition</label>
                <select id="acqSelect"><option value="">Charger les acquisitions...</option></select>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Pipeline imaging-sdk</label>
                <select id="presetSelect">
                    <option value="replay_membre">replay_membre (standard)</option>
                    <option value="high_contrast">high_contrast</option>
                    <option value="soft_denoise">soft_denoise</option>
                </select>
            </div>
            <div class="form-group">
                <label>Assignee CVAT</label>
                <input type="text" id="assigneeInput" placeholder="nom utilisateur CVAT">
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="preAnnotate">
                <label for="preAnnotate" style="font-size:0.9em;">Pre-annotation ML (bone-ml)</label>
            </div>
        </div>
        <div style="margin-top:12px; display:flex; gap:8px;">
            <button class="btn btn-primary" onclick="createTask()">Creer la tache</button>
            <button class="btn btn-outline" onclick="toggleForm()">Annuler</button>
        </div>
        <div id="createStatus" style="margin-top:8px; font-size:0.85em;"></div>
    </div>

    <div class="filters">
        <label style="font-size:0.85em; font-weight:600; color:#4a5568;">Filtres:</label>
        <select id="filterStatus" onchange="loadTasks()">
            <option value="">Tous les statuts</option>
            <option value="created">Created</option>
            <option value="annotating">Annotating</option>
            <option value="reviewing">Reviewing</option>
            <option value="validated">Validated</option>
            <option value="rejected">Rejected</option>
        </select>
        <select id="filterBone" onchange="loadTasks()">
            <option value="">Tous les os</option>
            <option value="humerus">Humerus</option>
            <option value="radius">Radius</option>
            <option value="ulna">Ulna</option>
            <option value="femur">Femur</option>
        </select>
    </div>

    <div class="task-table">
        <table>
            <thead><tr>
                <th>ID</th><th>Acquisition</th><th>Os</th><th>Pipeline</th>
                <th>Status</th><th>Assignee</th><th>Frames</th><th>Actions</th>
            </tr></thead>
            <tbody id="taskBody">
                <tr><td colspan="8" class="empty-state">Chargement...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
const API = '';

function toggleForm() {
    document.getElementById('createForm').classList.toggle('show');
}

async function loadSources() {
    try {
        const r = await fetch(`${API}/api/sources`);
        const d = await r.json();
        const sel = document.getElementById('sourceSelect');
        sel.innerHTML = '';
        (d.sources || []).forEach(s => {
            sel.innerHTML += `<option value="${s.name}">${s.name} - ${s.description}</option>`;
        });
    } catch(e) { console.error('Sources:', e); }
}

async function loadAcquisitions() {
    const source = document.getElementById('sourceSelect').value;
    const bone = document.getElementById('boneTypeSelect').value;
    const sel = document.getElementById('acqSelect');
    sel.innerHTML = '<option value="">Chargement...</option>';
    try {
        let url = `${API}/api/sources/${source}/acquisitions?limit=500`;
        if (bone) url += `&bone_type=${bone}`;
        const r = await fetch(url);
        const d = await r.json();
        sel.innerHTML = '<option value="">Selectionnez...</option>';
        (d.acquisitions || []).forEach(a => {
            sel.innerHTML += `<option value="${a.id}" data-bone="${a.bone_type}">${a.id} (${a.bone_type} ${a.side} - ${a.frame_count} frames)</option>`;
        });
    } catch(e) {
        sel.innerHTML = '<option value="">Erreur chargement</option>';
    }
}

function filterAcquisitions() { loadAcquisitions(); }

async function createTask() {
    const acq = document.getElementById('acqSelect');
    const opt = acq.options[acq.selectedIndex];
    if (!acq.value) { alert('Selectionnez une acquisition'); return; }
    const bone = opt.dataset.bone || document.getElementById('boneTypeSelect').value;
    const body = {
        source_name: document.getElementById('sourceSelect').value,
        acquisition_id: acq.value,
        bone_type: bone,
        pipeline_preset: document.getElementById('presetSelect').value,
        assignee: document.getElementById('assigneeInput').value || null,
        pre_annotate: document.getElementById('preAnnotate').checked,
    };
    const status = document.getElementById('createStatus');
    status.textContent = 'Creation en cours...';
    try {
        const r = await fetch(`${API}/api/annotation/task`, {
            method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body)
        });
        const d = await r.json();
        if (r.ok) {
            status.innerHTML = `<span style="color:green">Tache ${d.task?.id} creee!</span>`;
            toggleForm(); loadTasks();
        } else {
            status.innerHTML = `<span style="color:red">Erreur: ${d.detail || 'Inconnu'}</span>`;
        }
    } catch(e) { status.innerHTML = `<span style="color:red">${e}</span>`; }
}

async function loadTasks() {
    const status = document.getElementById('filterStatus').value;
    const bone = document.getElementById('filterBone').value;
    let url = `${API}/api/annotation/tasks?limit=100`;
    if (status) url += `&status=${status}`;
    if (bone) url += `&bone_type=${bone}`;
    try {
        const r = await fetch(url);
        const d = await r.json();
        renderTasks(d.tasks || []);
        renderStats(d.tasks || [], d.total || 0);
    } catch(e) {
        document.getElementById('taskBody').innerHTML =
            '<tr><td colspan="8" class="empty-state">Erreur de chargement</td></tr>';
    }
}

function renderStats(tasks, total) {
    const counts = { created:0, annotating:0, reviewing:0, validated:0, rejected:0 };
    tasks.forEach(t => { if (counts[t.status] !== undefined) counts[t.status]++; });
    document.getElementById('stats').innerHTML = `
        <div class="stat"><div class="stat-value">${total}</div><div class="stat-label">Total</div></div>
        <div class="stat"><div class="stat-value">${counts.annotating}</div><div class="stat-label">En cours</div></div>
        <div class="stat"><div class="stat-value">${counts.reviewing}</div><div class="stat-label">Review</div></div>
        <div class="stat"><div class="stat-value">${counts.validated}</div><div class="stat-label">Validees</div></div>
    `;
}

function renderTasks(tasks) {
    const body = document.getElementById('taskBody');
    if (!tasks.length) {
        body.innerHTML = '<tr><td colspan="8" class="empty-state">Aucune tache. Cliquez "+ Nouvelle Tache".</td></tr>';
        return;
    }
    body.innerHTML = tasks.map(t => `<tr>
        <td><strong>#${t.id}</strong></td>
        <td>${t.acquisition_id}</td>
        <td>${t.bone_type}${t.region !== 'entire' ? ' ('+t.region+')' : ''}</td>
        <td>${t.pipeline_preset || '-'}</td>
        <td><span class="badge badge-${t.status}">${t.status}</span>
            ${t.has_pre_annotations ? '<span class="badge" style="background:#e9d8fd;color:#6b46c1;margin-left:4px">ML</span>' : ''}</td>
        <td>${t.assignee || '-'}</td>
        <td>${t.annotated_frames || 0}/${t.frame_count || 0}</td>
        <td class="actions">
            ${t.cvat_url ? `<a href="${t.cvat_url}" target="_blank" class="btn btn-sm btn-outline">CVAT</a>` : ''}
            ${['created','annotating'].includes(t.status) ? `<button class="btn btn-sm btn-outline" onclick="syncTask(${t.id})">Sync</button>` : ''}
            ${!t.has_pre_annotations ? `<button class="btn btn-sm btn-outline" onclick="preAnnotate(${t.id})">ML</button>` : ''}
            ${t.status === 'reviewing' ? `<button class="btn btn-sm btn-success" onclick="validateTask(${t.id},'validated')">Valider</button>
                <button class="btn btn-sm btn-danger" onclick="validateTask(${t.id},'rejected')">Rejeter</button>` : ''}
        </td>
    </tr>`).join('');
}

async function syncTask(id) {
    if (!confirm('Synchroniser les annotations depuis CVAT ?')) return;
    try {
        const r = await fetch(`${API}/api/annotation/sync/${id}`, {method:'POST'});
        const d = await r.json();
        alert(`Sync: ${d.synced_frames} frames, ${d.zones_count} zones, ${d.landmarks_count} landmarks (auteur: ${d.author})`);
        loadTasks();
    } catch(e) { alert('Erreur sync: '+e); }
}

async function preAnnotate(id) {
    if (!confirm('Demander les pre-annotations ML (bone-ml) ?')) return;
    try {
        const r = await fetch(`${API}/api/annotation/pre-annotate/${id}`, {method:'POST'});
        const d = await r.json();
        alert(`Pre-annotation: ${d.status} (bone-ml: ${d.bone_ml_status})`);
        loadTasks();
    } catch(e) { alert('Erreur: '+e); }
}

async function validateTask(id, decision) {
    const by = prompt('Votre nom (validateur):');
    if (!by) return;
    try {
        const r = await fetch(`${API}/api/annotation/validate/${id}`, {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({validated_by: by, decision: decision})
        });
        const d = await r.json();
        alert(`Tache ${id}: ${d.status}`);
        loadTasks();
    } catch(e) { alert('Erreur: '+e); }
}

// Init
loadSources();
loadTasks();
</script>
</body>
</html>
