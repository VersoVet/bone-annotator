# Configuration des sources d'images pour bone-annotator
# Chaque source fournit des acquisitions d'images osseuses

sources:
  bonestore:
    type: nfs
    enabled: true
    root: /mnt/bonestore
    description: "BoneStore NFS — collections fluoroscopie 360° (raw .b2nd)"

# PACS dédié aux datasets préparés pour annotation/training
dataset_pacs:
  host: 10.0.0.90
  port: 8042
  name: OnyxBoneDatasetTraining
  description: "PACS Orthanc — datasets préparés (PNG 16-bit traitées)"

# Fallback stockage local si PACS indisponible
dataset_storage_fallback:
  root: /mnt/cortex-bone-share/datasets

# Imaging pipelines — imaging-sdk sur Synapse (voir bone-annotator.yaml)
imaging:
  pipeline_dir: /opt/onyx/imaging-sdk/pipelines/users

# MedSAM2 — propagation temporelle sur OnyxTensor GPU 2 (RTX 2060S)
medsam2:
  gpu_direct: http://10.0.0.73:9473

# SAM (Segment Anything) — serveur GPU direct sur OnyxTensor GPU 2 (RTX 2060S)
sam:
  gpu_direct: http://10.0.0.73:9470
  default_model: vit_b
