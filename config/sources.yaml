# Configuration des sources d'images pour bone-annotator
# Chaque source fournit des acquisitions d'images osseuses

sources:
  bonestore:
    type: nfs
    enabled: true
    root: /mnt/bonestore
    description: "BoneStore NFS — collections fluoroscopie 360° (raw .b2nd)"

# PACS dédié aux datasets préparés pour annotation/training
dataset_pacs:
  host: 10.0.0.90
  port: 8042
  name: OnyxBoneDatasetTraining
  description: "PACS Orthanc — datasets préparés (PNG 16-bit traitées)"

# Fallback stockage local si PACS indisponible
dataset_storage_fallback:
  root: /mnt/soma-shared/annotation-datasets

# Segment Anything Model pour CVAT (outil d'annotation AI)
# Changer model_type et relancer scripts/deploy_sam.sh pour switch
sam:
  model_type: vit_b                # vit_b (rapide/CPU), vit_l (moyen), vit_h (précis/GPU)
  checkpoint: sam_vit_b_01ec64.pth
  checkpoint_url: https://dl.fbaipublicfiles.com/segment_anything/sam_vit_b_01ec64.pth
  cvat_host: 10.0.0.59             # Machine où CVAT + Nuclio tourne
  cvat_path: /opt/onyx/cvat        # Répertoire CVAT sur la machine cible
