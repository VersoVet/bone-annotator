# Configuration centralisée bone-annotator
# Tous les endpoints, credentials et paramètres en un seul fichier

# PostgreSQL — annotations, tâches, training runs (OnyxPlex)
postgres:
  host: 10.0.0.8
  port: 5432
  user: onyx
  password: ""
  dbname: bone_recognition
  schema: bone_annotations
  vault_key: onyxplex_password

# pgvector — embeddings vectoriels (OnyxPlex onyx_vectors)
pgvector:
  host: 10.0.0.8
  port: 5432
  database: onyx_vectors
  user: onyx
  vault_key: onyxplex_password
  collection: bone_atlas
  vector_size: 1024

# CVAT — annotation collaborative
cvat:
  host: 10.0.0.59
  port: 8080
  username: admin
  password: ""
  # password chargé depuis Vault: cvat_admin_password

# ml-compute — Ray cluster, training GPU
ml_compute:
  host: 10.0.0.44
  port: 9469

# bone-ml — pré-annotation YOLO
bone_ml:
  host: 10.0.0.59
  port: 9463

# Redis — events, status
redis:
  host: 10.0.0.44
  port: 6379
  db: 0

# BoneStore — acquisitions NFS
bonestore:
  root: /mnt/bonestore

# PACS dataset training
dataset_pacs:
  host: 10.0.0.90
  port: 8042
  # user/password chargés depuis Vault

# Vault — secrets
vault:
  url: http://10.0.0.44:8050
  # token depuis env var ONYX_VAULT_TOKEN

# Imaging treatment pipelines (imaging-sdk sur Synapse)
imaging:
  bundled_dir: /opt/onyx/imaging-sdk/pipelines
  user_dir: /opt/onyx/imaging-sdk/pipelines/users
  default_treatment: os_nu_medsam_user
  default_treatment_label: "Os nu — MedSAM [USER]"
  default_pre_annotate: false
  default_active_learning_pipeline: os_nu_medsam_user

# Preprocessing — traitement batch local sur Synapse
preprocessing:
  mode: local                  # "local" (Synapse) — OnyxPlex = PG only
  remote_host: 10.0.0.59      # OnyxSynapse (fallback si mode=remote)
  remote_port: 9480
  n_workers: 12
  timeout_seconds: 600
  shared_output_root: /mnt/cortex-bone-share/datasets

# Annotation profiles — schema de creation des jeux de donnees
annotation:
  profile_schema: annotation-profiles.yaml   # Fichier YAML actif (dans config/)
  # Schemas disponibles: annotation-profiles.yaml, profiles-os-nus.yaml, profiles-radio.yaml, ...

# Dashboard — valeurs par défaut UI
dashboard:
  title: "Gestion des Annotations"
  poll_interval_ms: 5000

# Learning dashboard — alertes, rapports, email
learning:
  report_email_to: hpc.verso@gmail.com
  regression_threshold: 0.02
  new_acquisitions_alert_threshold: 100
  ml_correction_ready_threshold: 0.10

# Endpoints services externes
endpoints:
  email: http://10.0.0.44:8054
